<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- FIX (a11y): removed user-scalable=no — Apple/Play accessibility reviewers flag this. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <!-- ── Content Security Policy — XSS va resurs-injeksiyaga qarshi himoya ──
         style-src 'unsafe-inline': ilova inline-style obyektlaridan foydalanadi.
         connect-src: faqat o'z API + O!Dengi + green-api. img: PB + data + https. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.kemalusman.kg https://api.dengi.o.kg https://api.green-api.com https://nominatim.openstreetmap.org https://graph.instagram.com; media-src 'self' https: blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <title>Kemal Usman — Парфюмерия в Бишкеке</title>
    <meta name="description" content="Kemal Usman — оригинальная парфюмерия на разлив и в упаковке в Бишкеке. Доставка, бонусы, онлайн-оплата." />
    <meta property="og:title" content="Kemal Usman — Парфюмерия в Бишкеке" />
    <meta property="og:description" content="Оригинальные ароматы на разлив. Доставка по Бишкеку." />
    <meta property="og:image" content="https://kemalusman.kg/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- ── Branded intro — "Kemal Usman" wordmark, light letter-spacing settle.
         Pure CSS (CSP blocks inline JS); main.jsx removes the node after the
         outro. Native splash is plain white, so this reads as ONE seamless
         launch animation. Dark-scheme variant below. ── -->
    <style>
      #ku-intro {
        position: fixed; inset: 0; z-index: 999999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; background: #FFFFFF;
        transition: opacity 0.45s ease, visibility 0.45s;
      }
      #ku-intro .ku-name {
        font-family: 'Playfair Display', 'Bodoni 72', Didot, Georgia, serif;
        font-style: italic; font-weight: 700;
        font-size: clamp(26px, 8vw, 34px);
        color: #111111;
        animation: kuNameIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #ku-intro .ku-sub {
        font-family: -apple-system, system-ui, sans-serif;
        font-size: 11px; font-weight: 600;
        letter-spacing: 0.45em; text-indent: 0.45em;
        color: #C9A84C;
        animation: kuSubIn 0.7s ease 0.45s both;
      }
      #ku-intro.ku-intro-out { opacity: 0; visibility: hidden; pointer-events: none; }
      @keyframes kuNameIn {
        from { opacity: 0; letter-spacing: 0.28em; transform: translateY(6px); }
        to   { opacity: 1; letter-spacing: 0.04em; transform: none; }
      }
      @keyframes kuSubIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @media (prefers-color-scheme: dark) {
        #ku-intro { background: #0B0B0C; }
        #ku-intro .ku-name { color: #F5F5F7; }
      }
      @media (prefers-reduced-motion: reduce) {
        #ku-intro .ku-name, #ku-intro .ku-sub { animation: none; }
      }
    </style>
    <div id="ku-intro" aria-hidden="true">
      <div class="ku-name">Kemal Usman</div>
      <div class="ku-sub">PARFUM</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
