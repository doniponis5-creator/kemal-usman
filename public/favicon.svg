<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Black rounded background -->
  <rect width="32" height="32" rx="6" fill="#0a0a0a"/>

  <!-- Letter K (built with rectangles, no font needed) -->
  <!-- K vertical bar -->
  <rect x="3" y="7" width="2.5" height="18" rx="1" fill="#ffffff"/>
  <!-- K upper arm -->
  <polygon points="5.5,15.5 12,7 14.5,7 8,15.5" fill="#ffffff"/>
  <!-- K lower arm -->
  <polygon points="5.5,16.5 14.5,25 12,25 5.5,16.5" fill="#ffffff"/>

  <!-- Letter U (built with rectangles + arc, no font needed) -->
  <!-- U left bar -->
  <rect x="17" y="7" width="2.5" height="14" rx="1" fill="#ffffff"/>
  <!-- U right bar -->
  <rect x="24" y="7" width="2.5" height="14" rx="1" fill="#ffffff"/>
  <!-- U bottom curve -->
  <path d="M17 20 Q17 25.5 23.25 25.5 Q29.5 25.5 26.5 20" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Gold diagonal slash — brand signature -->
  <line x1="15" y1="5.5" x2="18.5" y2="26.5" stroke="#c9a96e" stroke-width="1.6" stroke-linecap="round"/>
</svg>
